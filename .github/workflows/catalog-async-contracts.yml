name: Startup profile diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project-bun
        with:
          role: runtime
      - run: bun install --frozen-lockfile
      - run: bun scripts/diagnostics/startup-profile.ts
  regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project-bun
        with:
          role: runtime
      - run: bun install --frozen-lockfile
      - run: bun test tests/cli/cli-access-audio-live.test.ts
      - run: bun test tests/cli/sibling-home-client-sync.test.ts -t 'a secondary ensure parent preserves'
