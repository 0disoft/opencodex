name: Cross-platform CI

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "ignored on this scratch diagnostic branch"
        type: choice
        default: all
        options: [all, release-gates, macos-control]

permissions:
  contents: read

jobs:
  windows-repro:
    name: win repro ${{ matrix.bun }} ${{ matrix.slot }}
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.4.3", "1.4.0"]
        slot: [1, 2, 3]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile
          bun run build
      - name: Repro loop
        shell: pwsh
        run: ./scripts/ci/diag-4956-windows.ps1 -Iterations 15
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: win-repro-${{ matrix.bun }}-${{ matrix.slot }}
          path: repro-out
          if-no-files-found: ignore

