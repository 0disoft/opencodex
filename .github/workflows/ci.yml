name: Cross-platform CI

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "ignored on this scratch diagnostic branch"
        type: choice
        default: all
        options: [all, release-gates, macos-control]

permissions:
  contents: read

jobs:
  repro:
    name: repro ${{ matrix.runtime }} ${{ matrix.slot }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [release, profile]
        slot: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-tags: true
      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun
        with:
          role: test-runner
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile
          bun run build
      - name: Tools
        run: |
          sudo apt-get install -y -q gdb >/dev/null 2>&1 || true
          gdb --version | head -1
          uname -a
      - name: Profile runtime
        if: matrix.runtime == 'profile'
        run: |
          v=$(bun --version)
          curl -fsSL -o /tmp/bp.zip "https://github.com/oven-sh/bun/releases/download/bun-v$v/bun-linux-x64-profile.zip"
          unzip -q /tmp/bp.zip -d /tmp/bp
          echo "REPRO_BUN=$(ls /tmp/bp/*/bun-profile)" >> "$GITHUB_ENV"
      - name: Repro loop
        env:
          REPRO_ITERATIONS: "28"
          REPRO_MODE: sequence
        run: bash scripts/ci/diag-4956-repro.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: repro-${{ matrix.runtime }}-${{ matrix.slot }}
          path: repro-out
          if-no-files-found: ignore

